  <rect width="940" height="520" fill="#ffffff"/>
  <text x="470" y="28" font-size="15.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Figure 4.3: Domain UML Class Diagram — Option-Attached Trap Architecture (backend/app/models/)</text>
