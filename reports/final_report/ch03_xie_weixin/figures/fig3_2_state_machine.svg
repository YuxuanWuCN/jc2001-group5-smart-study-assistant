<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#ffffff"/>
  <text x="460" y="28" font-size="15.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Figure 3.2: UML State Machine Diagram — Question Answering &amp; Misconception Diagnosis Lifecycle</text>
  <circle cx="45" cy="125" r="11" fill="#0f172a"/>
  <line x1="56" y1="125" x2="105" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="108" y="95" width="150" height="60" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <line x1="108" y1="120" x2="258" y2="120" stroke="#cbd5e1"/>
  <text x="183" y="113" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">BrowsingSubject</text>
  <text x="183" y="138" font-size="10.5" text-anchor="middle" fill="#475569">entry / GET /api/quiz</text>
  <line x1="258" y1="125" x2="330" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="294" y="116" font-size="10.5" text-anchor="middle" fill="#1e293b">loadItem</text>
  <rect x="333" y="95" width="160" height="60" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <line x1="333" y1="120" x2="493" y2="120" stroke="#bae6fd"/>
  <text x="413" y="113" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0369a1">QuestionPresented</text>
  <text x="413" y="138" font-size="10.5" text-anchor="middle" fill="#0f172a">do / render 4 options</text>
  <line x1="493" y1="125" x2="575" y2="125" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="534" y="116" font-size="10.5" text-anchor="middle" fill="#1e293b">selectKey(A..D)</text>
  <rect x="578" y="95" width="145" height="60" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <line x1="578" y1="120" x2="723" y2="120" stroke="#bae6fd"/>
  <text x="650" y="113" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0369a1">OptionSelected</text>
  <text x="650" y="138" font-size="10.5" text-anchor="middle" fill="#0f172a">entry / enableSubmit</text>
  <line x1="650" y1="155" x2="650" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="728" y="188" font-size="10.5" text-anchor="middle" fill="#1e293b">submit [POST /api/diagnose]</text>
  <rect x="570" y="218" width="160" height="58" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <line x1="570" y1="242" x2="730" y2="242" stroke="#fde68a"/>
  <text x="650" y="236" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#92400e">Submitted</text>
  <text x="650" y="260" font-size="10.5" text-anchor="middle" fill="#78350f">do / O(1) dictionary lookup</text>
  <line x1="570" y1="247" x2="310" y2="247" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="440" y="238" font-size="11" font-weight="bold" text-anchor="middle" fill="#047857">[is_correct == true]</text>
  <rect x="145" y="218" width="162" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <line x1="145" y1="242" x2="307" y2="242" stroke="#bbf7d0"/>
  <text x="226" y="236" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#166534">CorrectVerdict</text>
  <text x="226" y="260" font-size="10.5" text-anchor="middle" fill="#14532d">entry / radar_delta &gt; 0</text>
  <line x1="650" y1="276" x2="650" y2="345" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="752" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">[is_correct == false / resolve trap_id]</text>
  <rect x="560" y="348" width="180" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <line x1="560" y1="373" x2="740" y2="373" stroke="#fecaca"/>
  <text x="650" y="367" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#991b1b">MisconceptionVerdict</text>
  <text x="650" y="390" font-size="10.5" text-anchor="middle" fill="#7f1d1d">entry / bind TrapDetail(4 fields)</text>
  <text x="650" y="404" font-size="10" text-anchor="middle" fill="#7f1d1d">do / penalise radar_hit dimension</text>
  <line x1="560" y1="380" x2="435" y2="380" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="498" y="371" font-size="10.5" text-anchor="middle" fill="#991b1b">openDrawer</text>
  <rect x="260" y="348" width="172" height="64" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <line x1="260" y1="373" x2="432" y2="373" stroke="#ddd6fe"/>
  <text x="346" y="367" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#5b21b6">TrapDrawerOpen</text>
  <text x="346" y="390" font-size="10.5" text-anchor="middle" fill="#4c1d95">do / show title, desc, prereq</text>
  <text x="346" y="404" font-size="10" text-anchor="middle" fill="#4c1d95">do / Socratic follow-up prompt</text>
  <line x1="260" y1="380" x2="145" y2="380" stroke="#334155" stroke-width="2"/>
  <line x1="145" y1="380" x2="145" y2="276" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="95" y="335" font-size="10.5" text-anchor="middle" fill="#334155">closeDrawer /</text>
  <text x="95" y="349" font-size="10.5" text-anchor="middle" fill="#334155">syncTelemetry</text>
  <line x1="226" y1="218" x2="226" y2="175" stroke="#334155" stroke-width="2"/>
  <line x1="226" y1="175" x2="413" y2="175" stroke="#334155" stroke-width="2"/>
  <line x1="413" y1="175" x2="413" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="169" font-size="10.5" text-anchor="middle" fill="#1e293b">nextQuestion [items remaining]</text>
</svg>
