<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="l4Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="l3Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="l2Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="l1Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="920" height="520" rx="12" fill="url(#bgGrad)" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="460" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">
    Figure 6.1: StudyGraph Four-Tier Automated Testing Pyramid (9 Files → 80 Functions → 147 Cases)
  </text>
  <text x="460" y="58" text-anchor="middle" font-size="12.5" fill="#475569">
    100% In-Memory Execution via FastAPI TestClient · Zero External Daemons (0 Neo4j / 0 Live LLM Calls) · Total Runtime ~0.7–3.6 s
  </text>

  <!-- Layer 4 (Top): Adversarial & Stress Layer -->
  <polygon points="330,90 590,90 645,175 275,175" fill="url(#l4Grad)" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="460" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Tier 4: Adversarial &amp; Stress Layer</text>
  <text x="460" y="138" text-anchor="middle" font-size="11.5" fill="#FEE2E2">test_adversarial_backend.py (25 fn) + test_empirical_stress.py (7 fn)</text>
  <text x="460" y="157" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">SQL/XSS Injection, Boundary Overflow, Type Confusion, 50-Req Burst</text>

  <!-- Layer 3: E2E & Integration Layer -->
  <polygon points="270,185 650,185 705,270 215,270" fill="url(#l3Grad)" stroke="#B45309" stroke-width="1.5"/>
  <text x="460" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Tier 3: Integration, E2E Static Mount &amp; CORS Layer</text>
  <text x="460" y="233" text-anchor="middle" font-size="11.5" fill="#FEF3C7">test_e2e_frontend.py (6 fn) + test_cors.py (4 fn) + test_health.py (5 fn)</text>
  <text x="460" y="252" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">SPA Static Asset Delivery, CORS Preflight, Single-Port Lifespan Integrity</text>

  <!-- Layer 2: API / Interface Contract Layer -->
  <polygon points="210,280 710,280 765,365 155,365" fill="url(#l2Grad)" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="460" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Tier 2: RESTful API &amp; Endpoint Contract Layer (8 Endpoints)</text>
  <text x="460" y="328" text-anchor="middle" font-size="11.5" fill="#DBEAFE">test_diagnose.py (8 fn) + test_reports.py (11 fn) + test_auth.py (8 fn)</text>
  <text x="460" y="347" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">36-Trap Option Lookup, 5D Radar Telemetry, Salted SHA-256 Token Auth</text>

  <!-- Layer 1 (Base): Unit, Domain Model & Seed Integrity Layer -->
  <polygon points="150,375 770,375 825,460 95,460" fill="url(#l1Grad)" stroke="#047857" stroke-width="1.5"/>
  <text x="460" y="403" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Tier 1: Domain Model, Bijective Seed Integrity &amp; CamelModel Layer</text>
  <text x="460" y="423" text-anchor="middle" font-size="12" fill="#D1FAE5">test_quiz.py (6 fn) + Pydantic v2 Schema Validators + CamelModel Dual-Key Sync (+2 Regression Cases)</text>
  <text x="460" y="442" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">12 Questions × 4 Disciplines × 36 Distractor Traps (Bijective 1:1 Invariant, Answer Key Excluded)</text>

  <!-- Side Annotations -->
  <rect x="24" y="95" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="119" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Parametrised Expansion</text>
  <text x="119" y="138" text-anchor="middle" font-size="11" fill="#334155">78 Base + 2 Regression = 80 fn</text>
  <text x="119" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">@pytest.mark.parametrize → 147</text>

  <rect x="706" y="95" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="801" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">Zero-Dependency Gate</text>
  <text x="801" y="138" text-anchor="middle" font-size="11" fill="#334155">147 Passed, 0 Failed, 0 Skipped</text>
  <text x="801" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">100% Air-Gapped Reproducible</text>

  <text x="460" y="495" text-anchor="middle" font-size="11.5" fill="#64748B">
    Source: Verified via `python -m pytest tests/ -q` across 9 test modules (`tests/test_*.py`).
  </text>
</svg>
