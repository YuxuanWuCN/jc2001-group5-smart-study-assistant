<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="Figure 5.2 trap causal chain">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="720" fill="#ffffff"/>
  <text x="700.0" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 5.2  Trap causal chain: from a wrong selection to teaching feedback</text>
  <text x="700.0" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="middle">Every distractor carries a trap_id; the engine resolves it to a curated TrapDetail and turns it into feedback.</text>
  <rect x="40" y="96" width="240" height="104" rx="8" ry="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="160.0" y="132.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">1. Student selects</text>
  <text x="160.0" y="153.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">an option</text>
  <text x="160.0" y="174.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">key = B</text>
  <rect x="310" y="96" width="240" height="104" rx="8" ry="8" fill="#e0f2fe" stroke="#334155" stroke-width="1.4"/>
  <text x="430.0" y="132.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">2. option.is_correct ?</text>
  <text x="430.0" y="153.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">boolean test</text>
  <text x="430.0" y="174.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">(no model call)</text>
  <rect x="580" y="96" width="240" height="104" rx="8" ry="8" fill="#dcfce7" stroke="#334155" stroke-width="1.4"/>
  <text x="700.0" y="132.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Positive feedback</text>
  <text x="700.0" y="153.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">+ dimension credit</text>
  <text x="700.0" y="174.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">no trap lookup</text>
  <line x1="280" y1="148.0" x2="310" y2="148.0" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="148.0" x2="580" y2="148.0" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <text x="565.0" y="138.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">yes</text>
  <rect x="40" y="274" width="240" height="116" rx="8" ry="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="160.0" y="326.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">3. Read option.trap_id</text>
  <text x="160.0" y="347.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">e.g. trap_law_1</text>
  <rect x="310" y="274" width="240" height="116" rx="8" ry="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="430.0" y="326.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">4. traps[trap_id]</text>
  <text x="430.0" y="347.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">O(1) dictionary index</text>
  <rect x="580" y="274" width="240" height="116" rx="8" ry="8" fill="#e0f2fe" stroke="#334155" stroke-width="1.4"/>
  <text x="700.0" y="316.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">5. TrapDetail</text>
  <text x="700.0" y="337.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">title · desc · prereq</text>
  <text x="700.0" y="358.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">radar_hit</text>
  <rect x="850" y="274" width="240" height="116" rx="8" ry="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="970.0" y="316.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">6. Assemble</text>
  <text x="970.0" y="337.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">DiagnoseResponse</text>
  <text x="970.0" y="358.0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">verdict · prerequisite · target</text>
  <rect x="1120" y="274" width="240" height="116" rx="8" ry="8" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="1240.0" y="326.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">7. Diagnostic drawer</text>
  <text x="1240.0" y="347.5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">and radar update</text>
  <line x1="280" y1="332.0" x2="310" y2="332.0" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="332.0" x2="580" y2="332.0" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <line x1="820" y1="332.0" x2="850" y2="332.0" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <line x1="1090" y1="332.0" x2="1120" y2="332.0" stroke="#334155" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <path d="M 430 200 L 430 274" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#arrowhead)"/>
  <text x="438" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="start">no</text>
  <rect x="40" y="452" width="660" height="190" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="60" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="start">TrapDetail: the four fields of one trap</text>
  <text x="70" y="514" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">title</text>
  <text x="190" y="514" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">names the misconception: “revocation period treated as limitation period”</text>
  <text x="70" y="546" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">desc</text>
  <text x="190" y="546" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">states what is wrong: Civil Code Art. 152 vs. Art. 188</text>
  <text x="70" y="578" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">prereq</text>
  <text x="190" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">names the missing prerequisite: right of revocation vs. right of claim</text>
  <text x="70" y="610" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="start">radar_hit</text>
  <text x="190" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">records the capability dimension: trapDefense</text>
  <rect x="720" y="452" width="640" height="190" rx="10" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="740" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="start">Two boundaries the figure makes explicit</text>
  <text x="740" y="514" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Unknown question_id or unresolved trap_id: the engine still returns</text>
  <text x="740" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">HTTP 200 with a local fallback (fallback_mode = true), never a 5xx.</text>
  <text x="740" y="566" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start"></text>
  <text x="740" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Malformed request bodies are rejected at the schema layer (422)</text>
  <text x="740" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">before the engine runs, so they are not part of this chain.</text>
  <text x="120" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="start">wrong branch</text>
  <text x="700.0" y="682" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="normal" fill="#475569" text-anchor="middle">Source: backend/app/data/seed_questions.py (trap_law_1); backend/app/services/diagnostic_service.py (lookup and fallback).</text>
</svg>
