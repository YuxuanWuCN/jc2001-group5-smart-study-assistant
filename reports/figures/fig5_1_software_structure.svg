  <rect x="350" y="402" width="430" height="82" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="364" y="422" font-size="12" font-weight="700" fill="#14532d">«subpackage» models/ (Pydantic v2 Schemas)</text>
  <rect x="364" y="432" width="402" height="40" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="565" y="449" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">common.py (CamelModel) · quiz.py · diagnose.py · report.py</text>
  <text x="565" y="464" text-anchor="middle" font-size="10" fill="#475569">Dual snake_case / camelCase serialisation &amp; bijective Option-to-Trap validation</text>

