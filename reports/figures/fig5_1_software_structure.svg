  <rect width="1120" height="620" fill="url(#bg51)" rx="12" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="560" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Figure 5.1: SmartStudy (StudyGraph) Software Package &amp; Module Structure</text>
  <text x="560" y="56" text-anchor="middle" font-size="12" fill="#475569">Single-origin FastAPI application (backend/app/) serving zero-build ES6+ SPA (frontend/) and offline evaluation pipelines</text>

