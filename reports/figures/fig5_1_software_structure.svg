  <text x="868" y="174" font-size="11" fill="#475569">• graphrag_pipeline.py (12-stage)</text>
  <text x="868" y="194" font-size="11" fill="#475569">• real_graph_engine.py (Neo4j)</text>
  <text x="868" y="214" font-size="11" fill="#475569">• ragas_evaluator.py (4 metrics)</text>
  <text x="868" y="234" font-size="11" fill="#475569">• final_systematic_report.csv</text>
