  <text x="364" y="518" font-size="12" font-weight="700" fill="#14532d">«subpackage» data/ (Deterministic In-Memory Store)</text>
  <rect x="364" y="526" width="402" height="28" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="565" y="544" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">seed_questions.py (12 Items, 36 Traps, 12 Subgraphs) · report_seed.py</text>

