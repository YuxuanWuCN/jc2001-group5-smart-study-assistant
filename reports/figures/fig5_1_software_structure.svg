  <text x="46" y="476" font-size="11" fill="#475569">• test_reports.py / test_integration.py</text>
  <text x="46" y="496" font-size="11" fill="#475569">• test_adversarial_backend.py</text>
  <text x="46" y="516" font-size="11" fill="#475569">• test_frontend_DOM_integrity.py</text>
