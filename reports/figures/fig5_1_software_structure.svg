  <rect x="30" y="80" width="250" height="32" rx="8" fill="#2563eb"/>
  <text x="155" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">«package» frontend/ (Zero-Build SPA)</text>

  <rect x="46" y="126" width="218" height="54" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="58" y="146" font-size="12" font-weight="700" fill="#1e3a8a">index.html</text>
  <text x="58" y="164" font-size="11" fill="#475569">4-View Semantic Shell + SVG Drawer</text>

  <rect x="46" y="192" width="218" height="60" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="58" y="212" font-size="12" font-weight="700" fill="#1e3a8a">app.js</text>
  <text x="58" y="229" font-size="11" fill="#475569">State Machine, Fetch API Client,</text>
  <text x="58" y="244" font-size="11" fill="#475569">5-Axis SVG Radar &amp; i18n Dictionary</text>

  <rect x="46" y="264" width="218" height="52" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="58" y="284" font-size="12" font-weight="700" fill="#1e3a8a">styles.css</text>
  <text x="58" y="301" font-size="11" fill="#475569">Cyber Obsidian &amp; Daylight Tokens</text>

  <!-- Backend Package -->
  <rect x="330" y="80" width="470" height="495" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="330" y="80" width="470" height="32" rx="8" fill="#15803d"/>
  <text x="565" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">«package» backend/app/ (FastAPI ASGI Monolith)</text>

