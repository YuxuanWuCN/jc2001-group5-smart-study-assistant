  <text x="366" y="165" font-size="11" fill="#475569">Mounts /api/* routers, /api/health probe, and StaticFiles(directory="frontend", html=True)</text>

  <!-- Routers -->
  <rect x="350" y="196" width="430" height="90" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="364" y="216" font-size="12" font-weight="700" fill="#14532d">«subpackage» routers/ (HTTP Boundary Layer)</text>
